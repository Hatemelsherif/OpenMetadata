name: Build Arabic OpenMetadata Docker Image

on:
  push:
    branches:
      - stable-1.9.11
    paths:
      - 'openmetadata-ui/src/main/resources/ui/src/locale/languages/ar-sa.json'
      - 'openmetadata-ui/src/main/resources/ui/src/utils/i18next/**'
      - 'Dockerfile.arabic'
      - '.github/workflows/build-arabic-docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag version'
        required: false
        default: '1.9.11-arabic'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openmetadata-arabic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.9.11-arabic
            type=raw,value=latest
            type=sha,prefix=1.9.11-arabic-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.arabic
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
